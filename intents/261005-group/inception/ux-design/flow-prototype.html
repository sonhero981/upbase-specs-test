<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group · Flow prototype</title>
<style>
  :root{--bg:#f4f4f4;--panel:#fff;--line:#d0d0d0;--ink:#222;--muted:#6b6b6b;--soft:#ececec;--ok:#2e7d32;--bad:#c62828;--focus:#1f1f1f}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  button,input,select{font:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .proto{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 16px;background:#333;color:#fff;font-size:13px}
  .proto b{margin-right:8px}
  .proto label{display:flex;gap:6px;align-items:center}
  .proto select{background:#555;color:#fff;border:1px solid #777;border-radius:4px;padding:2px 6px}
  .proto nav{margin-left:auto;display:flex;gap:6px}
  .proto nav a{color:#fff;text-decoration:none;padding:2px 8px;border:1px solid #777;border-radius:4px}
  .proto nav a[aria-current]{background:#fff;color:#333}
  .app{display:flex;min-height:calc(100vh - 44px)}
  .side{width:64px;background:#4a4a4a;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0}
  .side span{width:32px;height:32px;border-radius:8px;background:#777;display:block}
  .side span.on{background:#ddd}
  main{flex:1;padding:24px 32px;max-width:1440px}
  .crumb{color:var(--muted);font-size:12px}
  h1{font-size:22px;margin:4px 0 16px}
  h2{font-size:16px;margin:0 0 12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .btn{border:1px solid #888;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
  .btn.primary{background:#444;color:#fff;border-color:#444}
  .btn.danger{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.link{border:0;background:none;text-decoration:underline;padding:0}
  .seg{display:inline-flex;border:1px solid #888;border-radius:6px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer}
  .seg button[aria-pressed=true]{background:#444;color:#fff}
  input[type=search],input[type=text],select.f{border:1px solid #999;border-radius:6px;padding:6px 10px;background:#fff}
  .tag{display:inline-block;border:1px solid #999;border-radius:4px;padding:0 6px;font-size:12px;margin-left:6px;background:var(--soft)}
  .muted{color:var(--muted)}
  .tree{list-style:none;margin:0;padding:0}
  .tree ul{list-style:none;margin:0;padding-left:28px}
  .row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid transparent;border-radius:6px}
  .row:hover{background:var(--soft)}
  .row .tw{width:20px;border:0;background:none;cursor:pointer}
  .row .hd{cursor:grab;color:var(--muted);user-select:none;width:14px}
  .row .hd.none{visibility:hidden}
  .row .nm{flex:1;cursor:pointer}
  .row .ct{width:90px;text-align:right;color:var(--muted)}
  .row.drop-ok{border-color:var(--ok)}
  .row.drop-bad{border-color:var(--bad)}
  .row.archived .nm{color:#999}
  .why{position:fixed;z-index:60;background:#222;color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;pointer-events:none;display:none}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-weight:600;background:#fafafa}
  .switch{position:relative;width:40px;height:22px;border-radius:11px;border:1px solid #888;background:#ddd;cursor:pointer;padding:0}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid #888;transition:left .15s}
  .switch[aria-checked=true]{background:#444}
  .switch[aria-checked=true]::after{left:20px}
  .switch:disabled{opacity:.4;cursor:not-allowed}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tabs span{padding:8px 12px;color:var(--muted)}
  .tabs span.on{color:var(--ink);border-bottom:2px solid #444}
  .stats{display:flex;gap:24px;margin:8px 0}
  .stat b{display:block;font-size:22px}
  .note{background:var(--soft);border:1px dashed #999;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:13px}
  .alert{border:1px solid #999;border-left:4px solid #666;background:#fafafa;padding:8px 12px;border-radius:4px;margin:8px 0}
  .undef{border:1px dashed var(--bad);color:var(--bad);font-size:12px;padding:2px 6px;border-radius:4px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:70}
  .scrim.open{display:flex}
  .modal{background:#fff;border-radius:8px;width:min(560px,92vw);max-height:88vh;overflow:auto;padding:20px}
  .modal.wide{width:min(860px,94vw)}
  .modal footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px}
  .pick label{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--soft)}
  .opt{display:flex;align-items:center;gap:10px;margin:10px 0}
  .toast{position:fixed;right:24px;bottom:24px;background:#333;color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:80}
  .skeleton{height:14px;background:var(--soft);border-radius:4px;margin:10px 0}
  @media (max-width:720px){main{padding:16px}.side{display:none}.proto nav{margin-left:0}}
</style>
</head>
<body>
<div class="proto" role="region" aria-label="Prototype controls">
  <b>Prototype · Group (LMS-F002) · flow prototype v0.1 · khung xám, chữ tiếng Anh là bản dịch nháp</b>
  <label>Vai <select id="c-role"><option value="manage">Ops, quyền quản lý nhóm</option><option value="view">Ops, chỉ quyền xem nhóm</option></select></label>
  <label>Dữ liệu <select id="c-data"><option value="normal">Bình thường</option><option value="empty">Rỗng</option></select></label>
  <label>Ép state <select id="c-state"><option value="">Không</option><option value="loading">Loading</option><option value="error">Error</option></select></label>
  <nav aria-label="Luồng">
    <a href="#/scr-1">1 · Danh sách nhóm</a>
    <a href="#/scr-11">2 · Giao nội dung</a>
    <a href="#/scr-18">3 · Chuyển phụ trách</a>
  </nav>
</div>
<div class="app">
  <div class="side" aria-hidden="true"><span></span><span></span><span></span><span class="on" title="Organization"></span><span></span></div>
  <main id="view" tabindex="-1"></main>
</div>
<div class="why" id="why"></div>
<div class="scrim" id="scrim" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Dữ liệu mẫu ===== */
const DATA = {
  groups: [
    {id:"g1",name:"ECOM",code:"ECOM",source:"sync",parent:null,members:212,manager:"Trần Minh Quân"},
    {id:"g2",name:"Trung tâm vận hành 1",code:"ECOM-TTVH1",source:"sync",parent:"g1",members:96,manager:null},
    {id:"g3",name:"Growth 1",code:"ECOM-G1",source:"sync",parent:"g2",members:31,manager:"Lê Thu Hà"},
    {id:"g4",name:"Sub-Growth 1",code:"ECOM-SG1",source:"sync",parent:"g3",members:9,manager:null},
    {id:"g5",name:"Fulfillment HCM",code:"ECOM-FHCM",source:"sync",parent:"g1",members:55,manager:"Nguyễn Thị Lan"},
    {id:"g6",name:"VẬN HÀNH",code:"VH",source:"sync",parent:null,members:88,manager:null},
    {id:"g7",name:"Onboarding Q4 2026",code:"ONB-Q4",source:"self",parent:null,members:24,manager:"Phạm Đức Anh"},
    {id:"g8",name:"Tân binh tháng 10",code:"ONB-Q4-10",source:"self",parent:"g7",members:12,manager:null},
    {id:"g9",name:"Tân binh tháng 11",code:"ONB-Q4-11",source:"self",parent:"g7",members:12,manager:null},
    {id:"g10",name:"Leadership Program",code:"LEAD-26",source:"self",parent:null,members:18,manager:null},
    {id:"g11",name:"Mentor nội bộ 2025",code:"MNB-25",source:"self",parent:null,members:6,manager:null,archived:true}
  ],
  classes: [
    {id:"c1",name:"An toàn lao động · K12",course:"An toàn lao động",period:"01/11 – 30/11/2026",via:48,on:"05/10/2026",cascade:false,auto:true,missing:0,ended:false},
    {id:"c2",name:"Kỹ năng giao tiếp · K3",course:"Kỹ năng giao tiếp",period:"Flexible, 60 days",via:0,on:"20/10/2026",cascade:true,auto:false,missing:12,ended:false},
    {id:"c3",name:"Văn hoá UpBase · K8",course:"Văn hoá UpBase",period:"01/09 – 30/09/2026",via:52,on:"28/08/2026",cascade:false,auto:true,missing:0,ended:true}
  ],
  openClasses: [
    {id:"o1",name:"Excel nâng cao · K5",course:"Excel nâng cao",already:3,test:1},
    {id:"o2",name:"Quản lý thời gian · K2",course:"Quản lý thời gian",already:0,test:1},
    {id:"o3",name:"An toàn thông tin · K7",course:"An toàn thông tin",already:10,test:1}
  ],
  groupDirect: 55, groupBranch: 55,
  profile: {name:"Nguyễn Thị Lan",email:"lannt@upbase.asia",
    groups:["ECOM / Fulfillment HCM"],
    managers:[{n:"Trần Minh Quân",t:"Primary"},{n:"Lê Thu Hà",t:"By group"}],
    resp:[{g:"Fulfillment HCM",role:"Manager",people:55},{g:"Onboarding Q4 2026",role:"Manager",people:24},{g:"Tân binh tháng 10",role:"Mentor",people:12},{g:"Leadership Program",role:"Manager",people:18}]},
  people:[{n:"Võ Hoàng Nam",already:["Leadership Program"]},{n:"Đặng Mỹ Linh",already:[]},{n:"Bùi Quốc Bảo",already:["Fulfillment HCM","Onboarding Q4 2026"]}]
};
const S = {view: localGet("view") || "tree", open: new Set(["g1","g7"]), showArchived:false};
function localGet(k){try{return localStorage.getItem("grp-"+k)}catch(e){return null}}
function localSet(k,v){try{localStorage.setItem("grp-"+k,v)}catch(e){}}

const $ = s => document.querySelector(s);
const ctl = () => ({role:$("#c-role").value, data:$("#c-data").value, state:$("#c-state").value});
const canManage = () => ctl().role === "manage";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display="none",3200)}
function openModal(html,wide){const m=$("#modal");m.className="modal"+(wide?" wide":"");m.innerHTML=html;$("#scrim").classList.add("open");const f=m.querySelector("[data-focus]")||m.querySelector("button,input,select");f&&f.focus()}
function closeModal(){$("#scrim").classList.remove("open")}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function forced(){const s=ctl().state;
  if(s==="loading")return '<div class="card" aria-busy="true"><div class="skeleton" style="width:40%"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div>';
  if(s==="error")return '<div class="card"><h2>Couldn\'t load this page</h2><p class="muted">Check your connection and try again.</p><button class="btn" onclick="document.getElementById(\'c-state\').value=\'\';render()">Try again</button></div>';
  return null}

/* ===== Luồng 1 · SCR1 Danh sách nhóm ===== */
const byId = id => DATA.groups.find(g=>g.id===id);
const kids = id => DATA.groups.filter(g=>g.parent===id && (S.showArchived || !g.archived));
function isDesc(a,b){let p=byId(b);while(p){if(p.id===a)return true;p=p.parent?byId(p.parent):null}return false}
function path(g){const a=[];let p=g;while(p){a.unshift(p.name);p=p.parent?byId(p.parent):null}return a.join(" / ")}
function noManager(g){let p=g;while(p){if(p.manager)return false;p=p.parent?byId(p.parent):null}return true}
function dropCheck(drag,target){
  if(drag.id===target.id||isDesc(drag.id,target.id))return "Can't move a group into its own sub-group";
  if(target.source!==drag.source)return "Self-created groups can only sit under self-created groups";
  if(target.archived)return "Archived groups can't receive sub-groups";
  if(drag.parent===target.id)return "Already under this group";
  return null}

function renderList(){
  const f=forced(); if(f)return f;
  const empty = ctl().data==="empty";
  const tools = `<div class="bar">
    <div class="seg" role="group" aria-label="View"><button aria-pressed="${S.view==="tree"}" data-view="tree">Tree</button><button aria-pressed="${S.view==="table"}" data-view="table">Table</button></div>
    <input type="search" id="q" placeholder="Search by name or code" aria-label="Search groups">
    <label class="opt" style="margin:0"><button class="switch" role="switch" aria-checked="${S.showArchived}" id="sw-arch" aria-label="Show archived groups"></button>Show archived groups</label>
    <span style="flex:1"></span>
    ${canManage()?'<button class="btn primary" id="btn-create">Create group</button>':''}
  </div>`;
  let body;
  if(empty) body = `<div class="card" style="text-align:center;padding:48px"><h2>No groups yet</h2><p class="muted">Groups synced from the HR system appear here after the first sync. You can also create your own.</p>${canManage()?'<button class="btn primary">Create group</button>':''}</div>`;
  else if(S.view==="tree") body = `<div class="card"><p class="muted" style="margin-top:0">${canManage()?"Drag a self-created group onto another self-created group to move the branch. Keyboard: open the group and change Parent group.":"View only. You can't move or edit groups."}</p><ul class="tree" role="tree" aria-label="Groups">${kids(null).map(treeNode).join("")}</ul></div>`;
  else body = `<div class="card"><div class="bar"><select class="f" aria-label="Source"><option>Source: All</option><option>HR sync</option><option>Self-created</option></select><select class="f" aria-label="Level"><option>Level: All</option></select><select class="f" aria-label="Status"><option>Status: Active</option></select><select class="f" aria-label="Manager"><option>Manager: All</option><option>No manager only</option></select></div>
    <table><thead><tr><th>Group</th><th>Code</th><th>Source</th><th>Members <span class="muted" title="Includes members of sub-groups">ⓘ</span></th><th>Manager</th><th>Status</th><th>Updated</th></tr></thead><tbody>
    ${DATA.groups.filter(g=>S.showArchived||!g.archived).map(g=>`<tr><td><a href="#/scr-11" title="${esc(path(g))}">${esc(g.name)}</a><div class="muted" style="font-size:12px">${esc(path(g))}</div></td><td>${g.code}</td><td>${g.source==="sync"?"HR sync":"Self-created"}</td><td>${g.members}</td><td>${g.manager?esc(g.manager):(noManager(g)?'<span class="tag">No manager</span>':'<span class="muted">Inherited</span>')}</td><td>${g.archived?'<span class="tag">Archived</span>':"Active"}</td><td>21/10/2026</td></tr>`).join("")}
    </tbody></table><p class="muted">1–${DATA.groups.length} of ${DATA.groups.length} · 20 per page</p></div>`;
  return `<div class="crumb">Organization / Learner Groups</div><h1 id="h">Learner Groups <span class="muted" style="font-size:12px;font-weight:400">SCR1</span></h1>${tools}${body}`;
}
function treeNode(g){
  const ks=kids(g.id), open=S.open.has(g.id), drag=canManage()&&g.source==="self"&&!g.archived;
  return `<li role="treeitem" aria-expanded="${ks.length?open:undefined}">
    <div class="row${g.archived?" archived":""}" data-id="${g.id}" ${drag?'draggable="true"':''}>
      <button class="tw" data-tw="${g.id}" aria-label="${open?"Collapse":"Expand"} ${esc(g.name)}">${ks.length?(open?"▾":"▸"):""}</button>
      <span class="hd${drag?"":" none"}" aria-hidden="true">⋮⋮</span>
      <span class="nm" data-open="${g.id}">${esc(g.name)}${g.source==="sync"?'<span class="tag">HR sync</span>':''}${noManager(g)?'<span class="tag">No manager</span>':''}${g.archived?'<span class="tag">Archived</span>':''}</span>
      <span class="ct" title="Includes members of sub-groups">${g.members} members</span>
    </div>
    ${ks.length&&open?`<ul role="group">${ks.map(treeNode).join("")}</ul>`:""}
  </li>`}
function bindList(){
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{S.view=b.dataset.view;localSet("view",S.view);render()});
  const sw=$("#sw-arch"); if(sw) sw.onclick=()=>{S.showArchived=!S.showArchived;render()};
  document.querySelectorAll("[data-tw]").forEach(b=>b.onclick=()=>{const id=b.dataset.tw;S.open.has(id)?S.open.delete(id):S.open.add(id);render()});
  document.querySelectorAll("[data-open]").forEach(s=>s.onclick=()=>location.hash="#/scr-11");
  const q=$("#q"); if(q) q.oninput=()=>{const v=q.value.trim().toLowerCase(); if(!v){render();return}
    const hits=DATA.groups.filter(g=>(g.name+g.code).toLowerCase().includes(v)&&(S.showArchived||!g.archived));
    const card=document.querySelector("main .card:last-child");
    card.innerHTML = hits.length?`<h2>${hits.length} result(s)</h2>`+hits.map(g=>`<div class="row"><span class="nm" data-open="${g.id}">${esc(g.name)}<div class="muted" style="font-size:12px">${esc(path(g))}</div></span><span class="ct">${g.members} members</span></div>`).join("")
      :`<div style="text-align:center;padding:32px"><h2>No groups match "${esc(q.value)}"</h2><p class="muted">Try another name or code.</p></div>`;
    card.querySelectorAll("[data-open]").forEach(s=>s.onclick=()=>location.hash="#/scr-11")};
  const cb=$("#btn-create"); if(cb) cb.onclick=()=>openModal(`<h2>Create group <span class="muted" style="font-size:12px">SCR2</span></h2>
    <p class="muted">Form khung: Group name, Group code, Description, Parent group. Chi tiết ở UX Brief.</p><footer><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" disabled>Save</button></footer>`);
  /* kéo thả */
  let dragId=null; const why=$("#why");
  document.querySelectorAll(".row[draggable]").forEach(r=>{
    r.addEventListener("dragstart",e=>{dragId=r.dataset.id;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId)});
    r.addEventListener("dragend",()=>{dragId=null;why.style.display="none";document.querySelectorAll(".row").forEach(x=>x.classList.remove("drop-ok","drop-bad"))});
  });
  document.querySelectorAll(".tree .row").forEach(r=>{
    r.addEventListener("dragover",e=>{if(!dragId)return;const err=dropCheck(byId(dragId),byId(r.dataset.id));
      r.classList.toggle("drop-ok",!err);r.classList.toggle("drop-bad",!!err);
      why.textContent=err||("Move here: under "+byId(r.dataset.id).name);why.style.display="block";why.style.left=(e.clientX+14)+"px";why.style.top=(e.clientY+14)+"px";
      if(!err)e.preventDefault()});
    r.addEventListener("dragleave",()=>r.classList.remove("drop-ok","drop-bad"));
    r.addEventListener("drop",e=>{e.preventDefault();const d=byId(dragId),t=byId(r.dataset.id);if(dropCheck(d,t))return;confirmMove(d,t)});
  });
}
function countBranch(id){let n=0;DATA.groups.filter(g=>g.parent===id).forEach(g=>{n+=1+countBranch(g.id)});return n}
function confirmMove(d,t){
  const old=d.parent?byId(d.parent).name:"(top level)";
  openModal(`<h2>Move branch? <span class="muted" style="font-size:12px">SCR3</span></h2>
    <p><b>${esc(d.name)}</b>, ${countBranch(d.id)} sub-group(s), <b>${d.members}</b> people affected.</p>
    <p>From <b>${esc(old)}</b> to <b>${esc(t.name)}</b>.</p>
    <p class="muted">Members and assigned classes stay as they are. Classes assigned to ${esc(t.name)} won't apply to this branch automatically.</p>
    <footer><button class="btn" data-focus onclick="closeModal()">Cancel</button><button class="btn primary" id="do-move">Move</button></footer>`);
  $("#do-move").onclick=()=>{d.parent=t.id;S.open.add(t.id);closeModal();render();toast(`Moved ${d.name} under ${t.name}`)};
}

/* ===== Luồng 2 · SCR11, SCR12, SCR13 Giao nội dung ===== */
function renderAssigned(){
  const f=forced(); if(f)return f;
  const empty=ctl().data==="empty", m=canManage();
  const head=`<div class="crumb">Organization / Learner Groups / ECOM / Fulfillment HCM</div>
    <h1>Fulfillment HCM <span class="tag">HR sync</span> <span class="muted" style="font-size:12px;font-weight:400">SCR4 · SCR11</span></h1>
    <div class="alert">This group is synced from the HR system. Its structure and members can't be edited in UpLMS. You can still assign classes, managers and mentors.</div>
    <div class="tabs"><span>Members</span><span class="on">Assigned Classes</span><span>People in Charge</span><span>Report</span></div>`;
  if(empty) return head+`<div class="card" style="text-align:center;padding:48px"><h2>No classes assigned yet</h2><p class="muted">Assign a class and everyone in this group is enrolled. New members can be enrolled automatically.</p>${m?'<button class="btn primary" id="btn-assign">Assign classes</button>':''}</div>`;
  return head+`<div class="card"><div class="bar"><h2 style="margin:0;flex:1">Assigned classes</h2>${m?'<button class="btn primary" id="btn-assign">Assign classes</button>':''}</div>
    <table><thead><tr><th>Class</th><th>Course</th><th>Class period</th><th>Enrolled via this group</th><th>Assigned on</th><th>Cascade</th><th>Auto-enroll</th><th></th></tr></thead><tbody>
    ${DATA.classes.map(c=>`<tr><td>${esc(c.name)}${c.ended?'<span class="tag" title="This class has ended. New members won\'t be enrolled.">Ended</span>':''}</td><td>${esc(c.course)}</td><td>${c.period}</td><td>${c.via}</td><td>${c.on}</td><td>${c.cascade?"On":"Off"}</td>
      <td><button class="switch" role="switch" aria-checked="${c.auto}" data-auto="${c.id}" aria-label="Auto-enroll new members for ${esc(c.name)}" ${m?"":"disabled"}></button></td>
      <td>${!m?"":c.via>0?'<span class="muted" style="font-size:12px">This class already has learners from this group and can\'t be removed</span>':'<button class="btn danger" data-rm="'+c.id+'">Remove</button>'}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="note">Dòng "Văn hoá UpBase · K8" đã kết thúc: công tắc vẫn hiện, người vào sau không được thêm (luật đứng dừng im lặng). Assumption, bảng duyệt dòng 14.</div>`;
}
function bindAssigned(){
  const b=$("#btn-assign"); if(b) b.onclick=assignModal;
  document.querySelectorAll("[data-auto]").forEach(sw=>sw.onclick=()=>{const c=DATA.classes.find(x=>x.id===sw.dataset.auto);
    if(c.auto){openModal(`<h2>Turn off auto-enroll? <span class="muted" style="font-size:12px">SCR13</span></h2><p>New members won't be enrolled in <b>${esc(c.name)}</b> automatically. Current learners keep studying as usual.</p><footer><button class="btn" data-focus onclick="closeModal()">Cancel</button><button class="btn primary" id="y">Turn off</button></footer>`);
      $("#y").onclick=()=>{c.auto=false;closeModal();render();toast("Auto-enroll turned off")}}
    else if(c.missing>0){openModal(`<h2>Turn on auto-enroll <span class="muted" style="font-size:12px">SCR13</span></h2><p><b>${c.missing}</b> members of this group aren't in <b>${esc(c.name)}</b> yet. Enroll them now?</p><footer><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" id="n">Only apply to new members</button><button class="btn primary" id="y" data-focus>Enroll now</button></footer>`);
      $("#y").onclick=()=>{c.auto=true;c.via+=c.missing;c.missing=0;closeModal();render();toast("Auto-enroll on. Enrolling members in the background")};
      $("#n").onclick=()=>{c.auto=true;closeModal();render();toast("Auto-enroll on for new members")}}
    else{c.auto=true;render();toast("Auto-enroll turned on")}});
  document.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{openModal(`<h2>Remove class from group?</h2><p class="muted">No one from this group has started it.</p><p><span class="undef">Chưa xác định: PRD chưa định nghĩa hộp xác nhận gỡ lớp</span></p><footer><button class="btn" data-focus onclick="closeModal()">Cancel</button><button class="btn danger" id="y">Remove</button></footer>`);
    $("#y").onclick=()=>{DATA.classes=DATA.classes.filter(c=>c.id!==x.dataset.rm);closeModal();render();toast("Class removed")}});
}
function assignModal(){
  const st={sel:new Set(),cascade:false,auto:false,q:""};
  const draw=()=>{
    const list=DATA.openClasses.filter(c=>(c.name+c.course).toLowerCase().includes(st.q.toLowerCase()));
    const base=st.cascade?DATA.groupBranch:DATA.groupDirect;
    let will=0,already=0,skip=0;[...st.sel].forEach(id=>{const c=DATA.openClasses.find(x=>x.id===id);already+=c.already;skip+=c.test;will+=Math.max(0,base-c.already-c.test)});
    $("#modal").innerHTML=`<h2>Assign classes to Fulfillment HCM <span class="muted" style="font-size:12px">SCR12</span></h2>
      <label for="cq">Classes <span class="muted">(only classes accepting learners)</span></label>
      <input type="search" id="cq" placeholder="Search by class or course name" value="${esc(st.q)}" style="width:100%;margin:6px 0">
      <div class="pick">${list.length?list.map(c=>`<label><input type="checkbox" data-c="${c.id}" ${st.sel.has(c.id)?"checked":""}> ${esc(c.name)} <span class="muted">· ${esc(c.course)}</span></label>`).join(""):'<p class="muted" style="padding:10px">No classes match. Ended classes aren\'t listed.</p>'}</div>
      <div class="opt"><button class="switch" role="switch" aria-checked="${st.cascade}" id="sw-c" aria-label="Cascade to sub-groups"></button><span>Cascade to sub-groups <span class="muted" title="When on, members of sub-groups are also enrolled in this class">ⓘ</span></span></div>
      <div class="opt"><button class="switch" role="switch" aria-checked="${st.auto}" id="sw-a" aria-label="Auto-enroll new members"></button><span>New members of this group will be automatically enrolled in this class <span class="muted" title="When off, only current members are enrolled. People who join later must be added manually.">ⓘ</span></span></div>
      <div class="card" style="background:#fafafa" aria-live="polite"><h2 style="margin-bottom:4px">Preview</h2>
        ${st.sel.size?`<div class="stats"><div class="stat"><b>${will}</b>will be enrolled</div><div class="stat"><b>${already}</b>already in class</div><div class="stat"><b>${skip}</b>skipped</div></div><p class="muted" style="margin:0">Skipped: test accounts are never enrolled.</p>`:'<p class="muted" style="margin:0">Select at least one class to see who will be enrolled.</p>'}
        ${st.sel.size&&base===0?'<p>No direct members. Turn on <b>Cascade to sub-groups</b> to enroll people in sub-groups.</p>':''}
      </div>
      <footer><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="do-assign" ${st.sel.size?"":"disabled"}>Assign</button></footer>`;
    $("#cq").oninput=e=>{st.q=e.target.value;draw();const i=$("#cq");i.focus();i.setSelectionRange(i.value.length,i.value.length)};
    document.querySelectorAll("[data-c]").forEach(cb=>cb.onchange=()=>{cb.checked?st.sel.add(cb.dataset.c):st.sel.delete(cb.dataset.c);draw()});
    $("#sw-c").onclick=()=>{st.cascade=!st.cascade;draw()};
    $("#sw-a").onclick=()=>{st.auto=!st.auto;draw()};
    $("#do-assign").onclick=()=>{[...st.sel].forEach(id=>{const c=DATA.openClasses.find(x=>x.id===id);DATA.classes.push({id:"n"+id,name:c.name,course:c.course,period:"—",via:0,on:"23/10/2026",cascade:st.cascade,auto:st.auto,missing:0,ended:false})});
      DATA.openClasses=DATA.openClasses.filter(c=>!st.sel.has(c.id));closeModal();render();toast("Assigning classes in the background. We'll update the list when it's done.")};
  };
  openModal("",true);draw();$("#cq").focus();
}

/* ===== Luồng 3 · SCR18, SCR20 Chuyển toàn bộ phụ trách ===== */
function renderProfile(){
  const f=forced(); if(f)return f;
  const p=DATA.profile, m=canManage(), empty=ctl().data==="empty";
  const resp=empty?[]:p.resp;
  return `<div class="crumb">User Management / Students / Student Profile</div><h1>${esc(p.name)} <span class="muted" style="font-size:12px;font-weight:400">SCR18</span></h1>
    <div class="tabs"><span class="on">Overview</span><span>Setting</span><span>Class &amp; Course</span><span>Certificate</span><span>Security</span></div>
    <div class="card"><h2>Groups</h2>${empty?'<p class="muted">Not in any group</p>':p.groups.map(g=>`<div>${esc(g)}</div>`).join("")}</div>
    <div class="card"><div class="bar"><h2 style="margin:0;flex:1">Managers</h2>${m?'<button class="btn">Change primary manager</button><button class="btn">Remove primary manager</button>':''}</div>
      ${p.managers.map(x=>`<div class="row"><span class="nm">${esc(x.n)}<span class="tag">${x.t}</span></span></div>`).join("")}</div>
    ${resp.length?`<div class="card"><div class="bar"><h2 style="margin:0;flex:1">Responsibilities</h2>${m?'<button class="btn primary" id="btn-transfer">Transfer all responsibilities</button>':''}</div>
      <table><thead><tr><th>Group</th><th>Role</th><th>People in branch</th></tr></thead><tbody>${resp.map(r=>`<tr><td>${esc(r.g)}</td><td>${r.role}</td><td>${r.people}</td></tr>`).join("")}</tbody></table></div>`
      :'<div class="note">Khối Responsibilities ẩn khi người này không quản lý hay làm mentor nhóm nào.</div>'}
    <div class="note">Primary manager trên hồ sơ không đổi khi chuyển phụ trách (BR-13.4).</div>`;
}
function bindProfile(){
  const b=$("#btn-transfer"); if(!b)return;
  b.onclick=()=>{const st={to:""};
    const draw=()=>{const who=DATA.people.find(x=>x.n===st.to);
      const rows=DATA.profile.resp.map(r=>({...r,has:who&&r.role==="Manager"&&who.already.includes(r.g)}));
      const groups=rows.length, people=rows.reduce((a,r)=>a+r.people,0), newMgr=rows.filter(r=>r.role==="Manager"&&!r.has).length;
      $("#modal").innerHTML=`<h2>Transfer all responsibilities <span class="muted" style="font-size:12px">SCR20</span></h2>
        <p class="muted">From <b>${esc(DATA.profile.name)}</b>. Manager and mentor roles move to the new person. Primary managers set on learner profiles don't change.</p>
        <label for="to">Transfer to</label>
        <select class="f" id="to" style="width:100%;margin:6px 0" data-focus><option value="">Search by name or email</option>${DATA.people.map(x=>`<option ${x.n===st.to?"selected":""}>${esc(x.n)}</option>`).join("")}</select>
        ${who?`<div class="stats"><div class="stat"><b>${groups}</b>groups</div><div class="stat"><b>${people}</b>people affected</div><div class="stat"><b>${esc(who.n)}</b>recipient</div></div>
          <table><thead><tr><th>Group</th><th>Role</th><th>People</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.g)}</td><td>${r.role}</td><td>${r.people}</td><td>${r.has?'<span class="tag">Already manages</span>':''}</td></tr>`).join("")}</tbody></table>
          <p class="muted">${newMgr?`${esc(who.n)} will get one email listing ${newMgr} new group(s) to manage. Mentor roles aren't emailed.`:"No email will be sent: they already manage every group being transferred."}</p>`
          :'<p class="muted">Choose who takes over to see what will move.</p>'}
        <footer><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="do-tr" ${who?"":"disabled"}>Transfer</button></footer>`;
      $("#to").onchange=e=>{st.to=e.target.value;draw()};
      $("#do-tr").onclick=()=>{const n=st.to;DATA.profile.resp=[];closeModal();render();toast(`Responsibilities transferred to ${n}`)};
    };
    openModal("",true);draw();};
}

/* ===== Điều hướng ===== */
const ROUTES={"#/scr-1":[renderList,bindList],"#/scr-11":[renderAssigned,bindAssigned],"#/scr-18":[renderProfile,bindProfile]};
function render(){const h=ROUTES[location.hash]?location.hash:"#/scr-1";const [r,b]=ROUTES[h];
  $("#view").innerHTML=r();if(!forced())b();
  document.querySelectorAll(".proto nav a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")===h))}
window.addEventListener("hashchange",()=>{closeModal();render();$("#view").focus()});
["#c-role","#c-data","#c-state"].forEach(s=>$(s).addEventListener("change",render));
render();
</script>
</body>
</html>
